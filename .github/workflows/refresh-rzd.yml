name: Refresh live RZD snapshot
run-name: Refresh RZD snapshot (${{ github.event_name }})

on:
  workflow_dispatch:
    inputs:
      from:
        description: Origin station
        required: true
        default: Москва
      to:
        description: Destination station
        required: true
        default: Адлер
      date_from:
        description: First travel date
        required: true
        default: "2026-08-15"
      days:
        description: Number of days
        required: true
        default: "14"
      top_per_day:
        description: Unique trains per day
        required: true
        default: "3"
      overall_top:
        description: Overall ranking size
        required: true
        default: "10"
  repository_dispatch:
    types: [refresh-rzd]
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-rzd-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, Windows, X64, rzd-live]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      PYTHON_BIN: C:/Users/1/.cache/codex-runtimes/codex-primary-runtime/dependencies/python/python.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: '& $env:PYTHON_BIN -m pip install -r requirements.txt'
      - name: Build request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
          INPUT_DATE_FROM: ${{ inputs.date_from }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_TOP_PER_DAY: ${{ inputs.top_per_day }}
          INPUT_OVERALL_TOP: ${{ inputs.overall_top }}
          PAYLOAD_FROM: ${{ github.event.client_payload.from }}
          PAYLOAD_TO: ${{ github.event.client_payload.to }}
          PAYLOAD_DATE_FROM: ${{ github.event.client_payload.date_from }}
          PAYLOAD_DAYS: ${{ github.event.client_payload.days }}
          PAYLOAD_TOP_PER_DAY: ${{ github.event.client_payload.top_per_day }}
          PAYLOAD_OVERALL_TOP: ${{ github.event.client_payload.overall_top }}
        run: '& $env:PYTHON_BIN scripts/build_workflow_request.py'
      - name: Fetch fresh RZD data
        run: '& $env:PYTHON_BIN fetch_rzd.py'
      - name: Validate snapshot
        run: '& $env:PYTHON_BIN scripts/validate_snapshot.py'
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add request.json data/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Refresh live RZD snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
